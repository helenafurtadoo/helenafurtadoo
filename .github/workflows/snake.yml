name: Gerar cobrinha de contribuições

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Gerar SVGs animados com contribuições vermelhas
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: helenafurtadoo
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD21A&color_dots=#EBEDF0,#F6B2B2,#EF7777,#E94A4A,#CC2424
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFD21A&color_dots=#151515,#7C2424,#A52B2B,#D33434,#F45151

      - name: Publicar os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
