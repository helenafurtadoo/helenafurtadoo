name: Gerar cobrinha de contribuições

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Gerar SVGs animados com contribuições verdes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: helenafurtadoo
          # Primeiro tom: dia sem atividade. Os quatro seguintes: dias com atividade.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD21A&color_dots=#333333,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFD21A&color_dots=#151515,#0e4429,#006d32,#26a641,#39d353

      - name: Publicar os SVGs na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
